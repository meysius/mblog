services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: mblog
      POSTGRES_PASSWORD: mblog
      POSTGRES_DB: mblog
    ports:
      # 5432 is taken by other local Postgres instances
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mblog", "-d", "mblog"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
