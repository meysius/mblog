# /etc/nginx/sites-available/blog.feghhi.com.conf, linked from sites-enabled.

server {
    listen 80;
    listen [::]:80;

    server_name blog.feghhi.com;
    root /var/www/blog/nginx-root; # acme.sh's webroot, for renewing the certificate

    location ~ ^/.well-known/acme-challenge {
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name blog.feghhi.com;

    ssl_certificate /etc/letsencrypt/blog.feghhi.com/fullchain.cer;
    ssl_certificate_key /etc/letsencrypt/blog.feghhi.com/blog.feghhi.com.key;
    include /etc/nginx/snippets/ssl-params.conf;

    location / {
        # The app takes the client's address for sign-in limits from the last
        # entry in X-Forwarded-For.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $http_host;
        # Pass streamed pages on as they render.
        proxy_buffering off;
        proxy_pass http://127.0.0.1:3001;
    }

    # Only the server calls this, on itself (mblog-reset-cache).
    location = /hooks/revalidate {
        return 404;
    }

    # Image uploads are up to 20 MB (MAX_IMAGE_BYTES in src/lib/media.ts).
    client_max_body_size 21m;
}
