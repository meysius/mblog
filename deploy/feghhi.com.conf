# /etc/nginx/sites-available/feghhi.com.conf, linked from sites-enabled.

# Plain HTTP: certificate renewals, and a redirect to https://feghhi.com for the rest.
server {
    listen 80;
    listen [::]:80;

    server_name feghhi.com www.feghhi.com;
    root /var/www/blog/nginx-root; # acme.sh's webroot, for renewing the certificate

    location ~ ^/.well-known/acme-challenge {
        allow all;
    }

    location / {
        return 301 https://feghhi.com$request_uri;
    }
}

# www.feghhi.com redirects to the bare domain.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name www.feghhi.com;

    ssl_certificate /etc/letsencrypt/feghhi.com/fullchain.cer;
    ssl_certificate_key /etc/letsencrypt/feghhi.com/feghhi.com.key;
    include /etc/nginx/snippets/ssl-params.conf;

    return 301 https://feghhi.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name feghhi.com;

    ssl_certificate /etc/letsencrypt/feghhi.com/fullchain.cer;
    ssl_certificate_key /etc/letsencrypt/feghhi.com/feghhi.com.key;
    include /etc/nginx/snippets/ssl-params.conf;

    location / {
        # The app takes the client's address for sign-in limits from the last
        # entry in X-Forwarded-For.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $http_host;
        # Pass streamed pages on as they render.
        proxy_buffering off;
        proxy_pass http://127.0.0.1:3001;
    }

    # Only the server calls this, on itself (mblog-reset-cache).
    location = /hooks/revalidate {
        return 404;
    }

    # Addresses from the Ghost blog mblog replaced on 2026-11-06. Ghost kept posts
    # at /<slug>/; /about/ and /rss/ need nothing, since Next.js drops the slash.
    location ~ ^/the-only-three-design-patterns-you-need-to-keep-shipping-fast/?$ {
        return 301 /posts/the-only-three-design-patterns-you-need-to-keep-shipping-fast;
    }
    location ^~ /author/ {
        return 301 /about;
    }

    # Image uploads are up to 20 MB (MAX_IMAGE_BYTES in src/lib/media.ts).
    client_max_body_size 21m;
}
